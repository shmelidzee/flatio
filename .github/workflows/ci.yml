name: CI

on:
  push:
    branches: ['feature/**', 'fix/**', 'develop']
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build and test
        run: chmod +x ./gradlew && ./gradlew build --no-daemon
