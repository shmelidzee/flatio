name: CI

on:
  push:
    branches: ['feature/**', 'fix/**', 'docs/**', 'develop', 'master']
  pull_request:
    branches: [develop, master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Build and run tests
        run: chmod +x ./gradlew && ./gradlew build integrationTest --no-daemon

  docker-build:
    name: Docker Build
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flatio:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to Docker Hub
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          docker tag flatio:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/flatio:${{ github.sha }}
          docker tag flatio:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/flatio:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/flatio:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/flatio:latest
