spring:
  application:
    name: flatio
  main:
    headless: true  # required for java.awt (ImageIO compression) in headless server environments
  datasource:
    url: ${DB_FLATIO_URL:jdbc:postgresql://localhost:5432/flatio}
    username: ${DB_FLATIO_USER:flatio}
    # No fallback (issue #389): a misconfigured environment must fail to start rather than
    # silently connect with a password published in this repository.
    password: ${DB_FLATIO_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Caps ?size= on every paginated endpoint. Without this, Spring Data's implicit default
        # (2000) is ~100x the @PageableDefault(size = 20) documented in controllers, letting any
        # authenticated caller force a large DISTINCT JOIN FETCH page in one request (issue #386).
        max-page-size: ${FLATIO_PAGEABLE_MAX_SIZE:100}
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.flatio: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

