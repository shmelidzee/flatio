nominatim:
  base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
  user-agent: ${NOMINATIM_USER_AGENT:Flatio/1.0 (cr7mks1@gmail.com)}
  language: ${NOMINATIM_LANGUAGE:ru}

flatio:
  sync:
    interval-ms: ${FLATIO_SYNC_INTERVAL_MS:1800000}
    # Number of consecutive full syncs a listing must be absent from before it is deactivated
    # (ListingIngestionServiceImpl#applyMissedSyncPenalty, only incremented by *FullSyncJob, which
    # runs once a day per source). threshold=1 means deactivation after the first missed full sync,
    # i.e. a maximum deactivation delay of ~1 day. No margin is kept for a single transient fetch
    # failure — see issue #335 for the reasoning behind removing that margin.
    inactive-threshold: ${FLATIO_SYNC_INACTIVE_THRESHOLD:1}
    cleanup:
      cron: ${FLATIO_SYNC_CLEANUP_CRON:0 30 1 * * *}
      keep-per-source: ${FLATIO_SYNC_CLEANUP_KEEP_PER_SOURCE:100}
    onliner:
      delta:
        cron: ${FLATIO_SYNC_ONLINER_DELTA_CRON:0 */10 * * * *}
      full:
        cron: ${FLATIO_SYNC_ONLINER_FULL_CRON:0 0 2 * * *}
    onliner-sale:
      delta:
        cron: ${FLATIO_SYNC_ONLINER_SALE_DELTA_CRON:0 */15 * * * *}
      full:
        cron: ${FLATIO_SYNC_ONLINER_SALE_FULL_CRON:0 0 3 * * *}
    realt:
      delta:
        cron: ${FLATIO_SYNC_REALT_DELTA_CRON:0 */15 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_FULL_CRON:0 0 4 * * *}
    realt-sale:
      delta:
        cron: ${FLATIO_SYNC_REALT_SALE_DELTA_CRON:0 */15 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_SALE_FULL_CRON:0 0 5 * * *}
    realt-room:
      delta:
        cron: ${FLATIO_SYNC_REALT_ROOM_DELTA_CRON:0 */5 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_ROOM_FULL_CRON:0 0 6 * * *}
    realt-room-sale:
      delta:
        cron: ${FLATIO_SYNC_REALT_ROOM_SALE_DELTA_CRON:0 */5 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_ROOM_SALE_FULL_CRON:0 0 7 * * *}
    realt-house-rent:
      delta:
        cron: ${FLATIO_SYNC_REALT_HOUSE_RENT_DELTA_CRON:0 */20 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_HOUSE_RENT_FULL_CRON:0 0 9 * * *}
    realt-house-sale:
      delta:
        cron: ${FLATIO_SYNC_REALT_HOUSE_SALE_DELTA_CRON:0 */5 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_HOUSE_SALE_FULL_CRON:0 0 8 * * *}
    kufar-apartment-rent:
      delta:
        cron: ${FLATIO_SYNC_KUFAR_APARTMENT_RENT_DELTA_CRON:0 */10 * * * *}
      full:
        cron: ${FLATIO_SYNC_KUFAR_APARTMENT_RENT_FULL_CRON:0 30 2 * * *}
    kufar-apartment-sale:
      delta:
        cron: ${FLATIO_SYNC_KUFAR_APARTMENT_SALE_DELTA_CRON:0 */15 * * * *}
      full:
        cron: ${FLATIO_SYNC_KUFAR_APARTMENT_SALE_FULL_CRON:0 30 3 * * *}
    kufar-room-rent:
      delta:
        cron: ${FLATIO_SYNC_KUFAR_ROOM_RENT_DELTA_CRON:0 */10 * * * *}
      full:
        cron: ${FLATIO_SYNC_KUFAR_ROOM_RENT_FULL_CRON:0 30 4 * * *}
    kufar-room-sale:
      delta:
        cron: ${FLATIO_SYNC_KUFAR_ROOM_SALE_DELTA_CRON:0 */15 * * * *}
      full:
        cron: ${FLATIO_SYNC_KUFAR_ROOM_SALE_FULL_CRON:0 30 5 * * *}
    kufar-house-rent:
      delta:
        cron: ${FLATIO_SYNC_KUFAR_HOUSE_RENT_DELTA_CRON:0 */15 * * * *}
      full:
        cron: ${FLATIO_SYNC_KUFAR_HOUSE_RENT_FULL_CRON:0 30 6 * * *}
    kufar-house-sale:
      delta:
        cron: ${FLATIO_SYNC_KUFAR_HOUSE_SALE_DELTA_CRON:0 */20 * * * *}
      full:
        cron: ${FLATIO_SYNC_KUFAR_HOUSE_SALE_FULL_CRON:0 30 7 * * *}
  geocoding:
    cron: ${FLATIO_GEOCODING_CRON:0 */30 * * * *}
    batch-size: ${FLATIO_GEOCODING_BATCH_SIZE:50}
    # Listings whose geocodingFailedAttempts reaches this threshold are excluded from
    # findNeedingGeocoding — otherwise a listing with persistently bad coordinates would keep
    # occupying batch slots on every run indefinitely (issue #380).
    max-attempts: ${FLATIO_GEOCODING_MAX_ATTEMPTS:5}
  search:
    fts-language: ${FLATIO_SEARCH_FTS_LANGUAGE:russian}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  scheduler:
    # Shared ThreadPoolTaskScheduler (SchedulerConfig#configureTasks) for Onliner/Realt sync jobs
    # and the health-freshness watchdog cron triggers. Since #332, Kufar sync jobs no longer run
    # here: their @Scheduled entry methods are also @Async("kufarSyncExecutor"), so the cron
    # trigger fires on this pool but the actual (potentially RateLimiter-blocking) job body is
    # handed off to the dedicated kufarSyncExecutor bean (see SchedulerConfig) in effectively zero
    # time. This pool's size therefore only needs to cover Onliner/Realt/watchdog concurrency, not
    # connector-kufar-detail contention — see the connector-kufar-detail timeout-duration comment
    # below for that pool's sizing.
    pool-size: ${FLATIO_SCHEDULER_POOL:5}
  filter:
    price:
      sell:
        low-max: ${SELL_PRICE_LOW_MAX:100000}
        medium-max: ${SELL_PRICE_MEDIUM_MAX:200000}
        high-max: ${SELL_PRICE_HIGH_MAX:400000}
  subscription:
    limits:
      user-max-active: ${SUBSCRIPTION_LIMIT_USER_MAX_ACTIVE:3}
      pro-max-active: ${SUBSCRIPTION_LIMIT_PRO_MAX_ACTIVE:20}
  favorites:
    limits:
      user-max-favorites: ${FAVORITES_LIMIT_USER_MAX:100}
      # Empty value binds to null (Spring's relaxed binding treats an empty string as "no value"),
      # which FavoriteLimitProperties/FavoriteServiceImpl treat as unlimited for the PRO/ADMIN tariff.
      pro-max-favorites: ${FAVORITES_LIMIT_PRO_MAX:}
  blacklist:
    limits:
      user-max-keywords: ${BLACKLIST_LIMIT_USER_MAX_KEYWORDS:20}
      # Empty value binds to null (Spring's relaxed binding treats an empty string as "no value"),
      # which BlacklistLimitProperties/BlacklistServiceImpl treat as unlimited for the PRO/ADMIN tariff.
      pro-max-keywords: ${BLACKLIST_LIMIT_PRO_MAX_KEYWORDS:}
  health:
    freshness:
      threshold-minutes: ${FLATIO_HEALTH_FRESHNESS_THRESHOLD_MINUTES:30}
      watchdog:
        cron: ${FLATIO_HEALTH_FRESHNESS_WATCHDOG_CRON:0 */15 * * * *}
  notifications:
    realtime:
      cron: ${FLATIO_NOTIFICATIONS_REALTIME_CRON:0 * * * * *}
      batch-size: ${FLATIO_NOTIFICATIONS_REALTIME_BATCH_SIZE:50}
      max-per-hour: ${FLATIO_NOTIFICATIONS_REALTIME_MAX_PER_HOUR:10}
      retry-delay-minutes: ${FLATIO_NOTIFICATIONS_REALTIME_RETRY_DELAY_MINUTES:5}
  nbrb:
    base-url: ${FLATIO_NBRB_BASE_URL:https://api.nbrb.by}
    sync-cron: ${FLATIO_NBRB_SYNC_CRON:0 0 5 * * *}
    # ISO currency code -> NBRb's own internal numeric currency ID (verified against NBRb's
    # currency directory before enabling — see NbrbProperties). Only USD is enabled by default;
    # add EUR (or others) here once its NBRb numeric ID has been confirmed.
    currency-ids:
      USD: ${NBRB_CURRENCY_ID_USD:431}

resilience4j:
  ratelimiter:
    instances:
      connector-onliner:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
      connector-onliner-sale:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
      connector-realt:
        limit-for-period: 1
        limit-refresh-period: 2s
        timeout-duration: 5s
      connector-realt-sale:
        limit-for-period: 1
        limit-refresh-period: 2s
        timeout-duration: 5s
      nominatim:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
      connector-nbrb:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
      connector-kufar:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
      # One HTTP call per ad (detail page), separate from the batched connector-kufar
      # search API calls above — slower refresh since this hits a heavier HTML endpoint.
      # This single RateLimiter instance is shared by all Kufar sync jobs (up to 6 running
      # concurrently — see issue #328), not one per job. limit-for-period/limit-refresh-period
      # stay untouched here — they bound real request throughput to Kufar (scraping etiquette,
      # issue #313). timeout-duration only bounds how long a thread blocks waiting for a permit,
      # so it must be sized independently: with 6 callers contending for 1 permit every 2s, a
      # thread can be queued up to (6 - 1) * 2s = 10s before it is next in line. 5s made most of
      # that queuing look like a genuine per-ad failure, dumping calls into
      # KufarAdDetailClient#fetchPreciseAddressFallback purely due to sibling-job contention
      # (#328). 15s covers the 10s worst case plus margin, while genuine per-ad failures (network
      # errors, broken __NEXT_DATA__) still fail fast — they never depend on this timeout because
      # KufarAdDetailClient#fetchPreciseAddress fails outside of and after permit acquisition.
      #
      # Issue #332: this 15s worst-case wait happens on the dedicated kufarSyncExecutor thread
      # pool (SchedulerConfig#kufarSyncExecutor, core=7/max=12 — sized for the 6 concurrent delta
      # jobs above plus one overlapping full sync), never on the shared flatio.scheduler.pool-size
      # ThreadPoolTaskScheduler used by Onliner/Realt sync and the health-freshness watchdog. Every
      # Kufar sync job's @Scheduled method is also @Async("kufarSyncExecutor"), so blocking here
      # cannot delay those unrelated cron ticks regardless of how this timeout-duration is tuned.
      connector-kufar-detail:
        limit-for-period: 1
        limit-refresh-period: 2s
        timeout-duration: 15s
    # Inbound REST rate limits — config templates only, no eagerly-created instance bean.
    # RateLimitFilter creates one RateLimiter per caller (IP or user) on demand via
    # RateLimiterRegistry.rateLimiter(key, configName), all sharing the named config below.
    # timeout-duration: 0s means acquirePermission() returns immediately instead of blocking
    # the request thread waiting for the next refresh window.
    configs:
      api-auth-telegram:
        limit-for-period: ${RATE_LIMIT_AUTH_REQUESTS:10}
        limit-refresh-period: ${RATE_LIMIT_AUTH_REFRESH_SECONDS:60}s
        timeout-duration: 0s
      api-authenticated:
        limit-for-period: ${RATE_LIMIT_API_REQUESTS:60}
        limit-refresh-period: ${RATE_LIMIT_API_REFRESH_SECONDS:60}s
        timeout-duration: 0s
      # Separate, more generous limiter for /api/v1/admin/** (issue #360): this is trusted
      # internal traffic from a handful of admins, not the public API — the admin SPA fires
      # several parallel queries per page (dashboard alone issues 6+), which exhausted the
      # shared api-authenticated budget during normal use.
      api-admin:
        limit-for-period: ${RATE_LIMIT_ADMIN_API_REQUESTS:240}
        limit-refresh-period: ${RATE_LIMIT_ADMIN_API_REFRESH_SECONDS:60}s
        timeout-duration: 0s
  retry:
    instances:
      connector-onliner:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      connector-onliner-sale:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      connector-realt:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      connector-realt-sale:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      connector-kufar:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      connector-nbrb:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      connector-kufar-detail:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      connector-onliner:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 1
      connector-onliner-sale:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 1
      # Issue #373: each realt.by category gets its own circuit breaker instance so a run of
      # failures in one category (e.g. Realt changes the room-listing page markup) cannot open
      # the breaker for unrelated, healthy categories that happen to share the same sliding
      # window. The Resilience4j RateLimiter stays shared per group (connector-realt /
      # connector-realt-sale, see the ratelimiter.instances section above) — rate limiting is
      # about being polite to the origin server, which is the same physical host regardless of
      # category, so sharing it there is intentional and unrelated to this per-category CB split.
      connector-realt-apartment-rent:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 1
      connector-realt-room-rent:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
