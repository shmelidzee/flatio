spring:
  application:
    name: flatio
  datasource:
    url: ${DB_FLATIO_URL:jdbc:postgresql://localhost:5432/flatio}
    username: ${DB_FLATIO_USER:flatio}
    password: ${DB_FLATIO_PASSWORD:flatio_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.flatio: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

connector:
  onliner:
    base-url: ${ONLINER_BASE_URL:https://ak.api.onliner.by}
    source-id: ${ONLINER_SOURCE_ID:ONLINER}
    region-code: ${ONLINER_REGION_CODE:BY}
    apartments-path: /search/apartments
    page-size: 50

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    no-photo-url: ${TELEGRAM_NO_PHOTO_URL:https://placehold.co/800x600/e2e8f0/94a3b8.png}

nominatim:
  base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
  user-agent: ${NOMINATIM_USER_AGENT:Flatio/1.0 (cr7mks1@gmail.com)}

flatio:
  sync:
    interval-ms: ${FLATIO_SYNC_INTERVAL_MS:1800000}
    inactive-threshold: ${FLATIO_SYNC_INACTIVE_THRESHOLD:3}
    onliner:
      delta:
        cron: ${FLATIO_SYNC_ONLINER_DELTA_CRON:0 */10 * * * *}
      full:
        cron: ${FLATIO_SYNC_ONLINER_FULL_CRON:0 0 2 * * *}
  geocoding:
    cron: ${FLATIO_GEOCODING_CRON:0 */30 * * * *}
    batch-size: ${FLATIO_GEOCODING_BATCH_SIZE:50}
  search:
    fts-language: ${FLATIO_SEARCH_FTS_LANGUAGE:russian}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  scheduler:
    pool-size: ${FLATIO_SCHEDULER_POOL:5}

resilience4j:
  ratelimiter:
    instances:
      connector-onliner:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
      nominatim:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
  retry:
    instances:
      connector-onliner:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      connector-onliner:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 1
