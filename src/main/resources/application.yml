spring:
  application:
    name: flatio
  main:
    headless: true  # required for java.awt (ImageIO compression) in headless server environments
  datasource:
    url: ${DB_FLATIO_URL:jdbc:postgresql://localhost:5432/flatio}
    username: ${DB_FLATIO_USER:flatio}
    password: ${DB_FLATIO_PASSWORD:flatio_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.flatio: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

connector:
  onliner:
    base-url: ${ONLINER_BASE_URL:https://ak.api.onliner.by}
    source-id: ${ONLINER_SOURCE_ID:ONLINER}
    region-code: ${ONLINER_REGION_CODE:BY}
    apartments-path: /search/apartments
    page-size: 50
  onliner-sale:
    base-url: ${ONLINER_SALE_BASE_URL:https://pk.api.onliner.by}
    source-id: ${ONLINER_SALE_SOURCE_ID:ONLINER_SALE}
    region-code: ${ONLINER_SALE_REGION_CODE:BY}
    apartments-path: /search/apartments
    page-size: 50
  realt:
    base-url: ${REALT_BASE_URL:https://realt.by}
    source-id: ${REALT_SOURCE_ID:REALT}
    region-code: ${REALT_REGION_CODE:BY}
    listings-path: ${REALT_LISTINGS_PATH:/rent/flat-for-long/}
    object-path-prefix: ${REALT_OBJECT_PATH_PREFIX:/rent-flat-for-long/object/}
  realt-sale:
    base-url: ${REALT_SALE_BASE_URL:https://realt.by}
    source-id: ${REALT_SALE_SOURCE_ID:REALT_SALE}
    region-code: ${REALT_SALE_REGION_CODE:BY}
    listings-path: ${REALT_SALE_LISTINGS_PATH:/sale/flats/}
    object-path-prefix: ${REALT_SALE_OBJECT_PATH_PREFIX:/sale-flat/object/}
  realt-room:
    base-url: ${REALT_BASE_URL:https://realt.by}
    source-id: ${REALT_ROOM_SOURCE_ID:REALT_ROOM}
    region-code: ${REALT_REGION_CODE:BY}
    listings-path: ${REALT_ROOM_LISTINGS_PATH:/rent/room-for-long/}
    object-path-prefix: ${REALT_ROOM_OBJECT_PATH_PREFIX:/rent-rooms-for-long/object/}
  realt-room-sale:
    base-url: ${REALT_BASE_URL:https://realt.by}
    source-id: ${REALT_ROOM_SALE_SOURCE_ID:REALT_ROOM_SALE}
    region-code: ${REALT_REGION_CODE:BY}
    listings-path: ${REALT_ROOM_SALE_LISTINGS_PATH:/sale/rooms/}
    object-path-prefix: ${REALT_ROOM_SALE_OBJECT_PATH_PREFIX:/sale-rooms/object/}
  realt-house-rent:
    base-url: ${REALT_BASE_URL:https://realt.by}
    source-id: ${REALT_HOUSE_RENT_SOURCE_ID:REALT_HOUSE_RENT}
    region-code: ${REALT_REGION_CODE:BY}
    listings-path: ${REALT_HOUSE_RENT_LISTINGS_PATH:/rent/cottage-for-long/}
    object-path-prefix: ${REALT_HOUSE_RENT_OBJECT_PATH_PREFIX:/rent-cottage-for-long/object/}
  realt-house-sale:
    base-url: ${REALT_BASE_URL:https://realt.by}
    source-id: ${REALT_HOUSE_SALE_SOURCE_ID:REALT_HOUSE_SALE}
    region-code: ${REALT_REGION_CODE:BY}
    listings-path: ${REALT_HOUSE_SALE_LISTINGS_PATH:/sale/cottages/}
    object-path-prefix: ${REALT_HOUSE_SALE_OBJECT_PATH_PREFIX:/sale-cottages/object/}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    webhook-url: ${TELEGRAM_WEBHOOK_URL:}
    webhook-secret-token: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:}
    no-photo-url: ${TELEGRAM_NO_PHOTO_URL:https://placehold.co/800x600/e2e8f0/94a3b8.png}
    executor:
      core-pool-size: ${TELEGRAM_EXECUTOR_CORE_POOL_SIZE:10}
      max-pool-size: ${TELEGRAM_EXECUTOR_MAX_POOL_SIZE:20}
      queue-capacity: ${TELEGRAM_EXECUTOR_QUEUE_CAPACITY:100}

nominatim:
  base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
  user-agent: ${NOMINATIM_USER_AGENT:Flatio/1.0 (cr7mks1@gmail.com)}
  language: ${NOMINATIM_LANGUAGE:ru}

flatio:
  sync:
    interval-ms: ${FLATIO_SYNC_INTERVAL_MS:1800000}
    inactive-threshold: ${FLATIO_SYNC_INACTIVE_THRESHOLD:3}
    onliner:
      delta:
        cron: ${FLATIO_SYNC_ONLINER_DELTA_CRON:0 */10 * * * *}
      full:
        cron: ${FLATIO_SYNC_ONLINER_FULL_CRON:0 0 2 * * *}
    onliner-sale:
      delta:
        cron: ${FLATIO_SYNC_ONLINER_SALE_DELTA_CRON:0 */15 * * * *}
      full:
        cron: ${FLATIO_SYNC_ONLINER_SALE_FULL_CRON:0 0 3 * * *}
    realt:
      delta:
        cron: ${FLATIO_SYNC_REALT_DELTA_CRON:0 */15 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_FULL_CRON:0 0 4 * * *}
    realt-sale:
      delta:
        cron: ${FLATIO_SYNC_REALT_SALE_DELTA_CRON:0 */15 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_SALE_FULL_CRON:0 0 5 * * *}
    realt-room:
      delta:
        cron: ${FLATIO_SYNC_REALT_ROOM_DELTA_CRON:0 */5 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_ROOM_FULL_CRON:0 0 6 * * *}
    realt-room-sale:
      delta:
        cron: ${FLATIO_SYNC_REALT_ROOM_SALE_DELTA_CRON:0 */5 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_ROOM_SALE_FULL_CRON:0 0 7 * * *}
    realt-house-rent:
      delta:
        cron: ${FLATIO_SYNC_REALT_HOUSE_RENT_DELTA_CRON:0 */20 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_HOUSE_RENT_FULL_CRON:0 0 9 * * *}
    realt-house-sale:
      delta:
        cron: ${FLATIO_SYNC_REALT_HOUSE_SALE_DELTA_CRON:0 */5 * * * *}
      full:
        cron: ${FLATIO_SYNC_REALT_HOUSE_SALE_FULL_CRON:0 0 8 * * *}
  geocoding:
    cron: ${FLATIO_GEOCODING_CRON:0 */30 * * * *}
    batch-size: ${FLATIO_GEOCODING_BATCH_SIZE:50}
  search:
    fts-language: ${FLATIO_SEARCH_FTS_LANGUAGE:russian}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  scheduler:
    pool-size: ${FLATIO_SCHEDULER_POOL:5}
  filter:
    price:
      sell:
        low-max: ${SELL_PRICE_LOW_MAX:100000}
        medium-max: ${SELL_PRICE_MEDIUM_MAX:200000}
        high-max: ${SELL_PRICE_HIGH_MAX:400000}
  health:
    freshness:
      threshold-minutes: ${FLATIO_HEALTH_FRESHNESS_THRESHOLD_MINUTES:30}
      watchdog:
        cron: ${FLATIO_HEALTH_FRESHNESS_WATCHDOG_CRON:0 */15 * * * *}

resilience4j:
  ratelimiter:
    instances:
      connector-onliner:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
      connector-onliner-sale:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
      connector-realt:
        limit-for-period: 1
        limit-refresh-period: 2s
        timeout-duration: 5s
      connector-realt-sale:
        limit-for-period: 1
        limit-refresh-period: 2s
        timeout-duration: 5s
      nominatim:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
    # Inbound REST rate limits — config templates only, no eagerly-created instance bean.
    # RateLimitFilter creates one RateLimiter per caller (IP or user) on demand via
    # RateLimiterRegistry.rateLimiter(key, configName), all sharing the named config below.
    # timeout-duration: 0s means acquirePermission() returns immediately instead of blocking
    # the request thread waiting for the next refresh window.
    configs:
      api-auth-telegram:
        limit-for-period: ${RATE_LIMIT_AUTH_REQUESTS:10}
        limit-refresh-period: ${RATE_LIMIT_AUTH_REFRESH_SECONDS:60}s
        timeout-duration: 0s
      api-authenticated:
        limit-for-period: ${RATE_LIMIT_API_REQUESTS:60}
        limit-refresh-period: ${RATE_LIMIT_API_REFRESH_SECONDS:60}s
        timeout-duration: 0s
  retry:
    instances:
      connector-onliner:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      connector-onliner-sale:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      connector-realt:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      connector-realt-sale:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - com.flatio.integration.core.ConnectorTransientException
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      connector-onliner:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 1
      connector-onliner-sale:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 1
      connector-realt:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 1
      connector-realt-sale:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 1

# The long-polling and webhook Telegram starters both auto-configure a bean named
# 'telegramBotsApplication' — having both active at once fails startup with
# BeanDefinitionOverrideException. Exactly one is excluded per profile, matching which
# transport FlatioLongPollingBot/TelegramWebhookConfig are @Profile-gated for.
---
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude: org.telegram.telegrambots.webhook.starter.TelegramBotStarterConfiguration
---
spring:
  config:
    activate:
      on-profile: '!local'
  autoconfigure:
    exclude: org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration
