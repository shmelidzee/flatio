<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Аренда квартир в Минске — Realt.by</title>
</head>
<body>
<section class="classified-listing">

  <article class="classified" data-classified-id="12345678">
    <div class="classified__image-block">
      <a href="/rent/flat-for-long/object/12345678/">
        <img class="classified__image" src="https://photo.realt.by/12/3456789.jpg" alt="Квартира" />
      </a>
    </div>
    <div class="classified__body">
      <h2 class="classified__title">
        <a href="/rent/flat-for-long/object/12345678/">2-комнатная квартира, 58 м², 5/9 эт.</a>
      </h2>
      <p class="classified__address">г. Минск, пр-т Независимости, 72</p>
      <div class="classified__price-block">
        <span class="price__amount">650</span>
        <span class="price__currency">USD</span>
      </div>
    </div>
  </article>

  <article class="classified" data-classified-id="87654321">
    <div class="classified__image-block">
      <!-- no photo available -->
    </div>
    <div class="classified__body">
      <h2 class="classified__title">
        <a href="/rent/flat-for-long/object/87654321/">3-комнатная квартира, 75 м², 8/12 эт.</a>
      </h2>
      <p class="classified__address">г. Минск, ул. Немига, 5</p>
      <div class="classified__price-block">
        <span class="price__amount">900</span>
        <span class="price__currency">USD</span>
      </div>
    </div>
  </article>

</section>
</body>
</html>
