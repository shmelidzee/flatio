<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Аренда квартир в Минске — Realt.by</title>
</head>
<body>
<div class="-mx-1.5 sm:-mx-2.5 flex flex-wrap md:mb-[60px]">

  <!-- Card 1: with photo -->
  <div data-index="0">
    <div class="sm:w-full w-full p-1.5 sm:p-2.5">
      <div class="hover:shadow-10bottom overflow-hidden rounded-md">
        <div class="bg-white flex flex-col md:flex-row relative">
          <a aria-label="&quot;Ссылка на объект №12345678&quot;" class="z-1 absolute top-0 left-0 w-full h-full cursor-pointer" target="_blank" href="/rent-flat-for-long/object/12345678/"></a>
          <div class="w-full md:max-w-[42.1%] relative">
            <div class="swiper swiper-initialized swiper-horizontal h-full">
              <div class="swiper-wrapper">
                <div class="swiper-slide swiper-slide-active">
                  <a target="_blank" href="/rent-flat-for-long/object/12345678/">
                    <span>
                      <img title="Снять 2-комнатную квартиру г. Минск, пр-т Независимости, 72" alt="" src="https://cdn.realt.by/img/12/3456789.jpg">
                    </span>
                  </a>
                </div>
              </div>
            </div>
          </div>
          <div class="flex flex-col w-full h-full p-5">
            <div class="-order-3 flex justify-between">
              <div>
                <div>
                  <span class="md:mr-0 flex items-center mr-1">
                    <span class="text-title font-semibold text-basic-900 bg-primary-300 px-1.5 py-0.5 rounded-sm md:px-2">2&nbsp;500&nbsp;р./мес.</span>
                  </span>
                </div>
              </div>
            </div>
            <p class="flex flex-wrap text-headline items-center font-semibold">
              <span class="mr-2">2 комн.</span>
              <span class="mr-2">58 м²</span>
              <span class="mr-2">5/9 этаж</span>
            </p>
            <div class="w-full">
              <div class="text-basic-900 overflow-hidden">
                <p class="text-basic w-full text-subhead md:text-body">г. Минск, пр-т Независимости, 72</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Card 2: no photo -->
  <div data-index="1">
    <div class="sm:w-full w-full p-1.5 sm:p-2.5">
      <div class="hover:shadow-10bottom overflow-hidden rounded-md">
        <div class="bg-white flex flex-col md:flex-row relative">
          <a aria-label="&quot;Ссылка на объект №87654321&quot;" class="z-1 absolute top-0 left-0 w-full h-full cursor-pointer" target="_blank" href="/rent-flat-for-long/object/87654321/"></a>
          <div class="w-full md:max-w-[42.1%] relative">
            <!-- no photo -->
          </div>
          <div class="flex flex-col w-full h-full p-5">
            <div class="-order-3 flex justify-between">
              <div>
                <div>
                  <span class="md:mr-0 flex items-center mr-1">
                    <span class="text-title font-semibold text-basic-900 bg-primary-300 px-1.5 py-0.5 rounded-sm md:px-2">3&nbsp;100&nbsp;р./мес.</span>
                  </span>
                </div>
              </div>
            </div>
            <p class="flex flex-wrap text-headline items-center font-semibold">
              <span class="mr-2">3 комн.</span>
              <span class="mr-2">75 м²</span>
              <span class="mr-2">8/12 этаж</span>
            </p>
            <div class="w-full">
              <div class="text-basic-900 overflow-hidden">
                <p class="text-basic w-full text-subhead md:text-body">г. Минск, ул. Немига, 5</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
